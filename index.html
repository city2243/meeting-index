<title>研究筆記</title>
<style>
* { box-sizing: border-box; }
:root { color-scheme: light dark; --bg: #f5f5f7; --card: #fff; --ink: #1d1d1f; --ink2: #6e6e73; --ring: rgba(0,0,0,.12); --acc: #0071e3; }
@media (prefers-color-scheme: dark) { :root { --bg: #000; --card: #1c1c1e; --ink: #f5f5f7; --ink2: #a1a1a6; --ring: rgba(255,255,255,.14); --acc: #2997ff; } }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
  font: 16px/1.6 -apple-system, "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; }
form { background: var(--card); border: 1px solid var(--ring); border-radius: 16px; padding: 28px 24px; width: min(360px, calc(100vw - 32px)); }
h1 { font-size: 20px; margin: 0 0 4px; } p { color: var(--ink2); margin: 0 0 16px; font-size: 14px; }
input[type=password] { font: inherit; width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--ring); background: var(--bg); color: var(--ink); }
label { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--ink2); margin: 12px 0 16px; }
button { font: inherit; width: 100%; padding: 10px; border: 0; border-radius: 10px; background: var(--acc); color: #fff; font-weight: 600; cursor: pointer; }
.err { color: #d03b3b; min-height: 1.4em; margin: 10px 0 0; font-size: 14px; }
</style></head><body>
